<!DOCTYPE html>
<html>
<head>
    <title>Estoque - Movimentações</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {% include "_nav.html" %}
    <h1>Movimentações</h1>
    <table>
        <tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Usuário</th><th>Cliente</th></tr>
        {% for m in movimentacoes %}
        <tr>
            <td>{{ m.data.strftime("%d/%m/%Y %H:%M") }}</td>
            <td>{{ m.produto.nome }}</td>
            <td>{{ m.tipo }}</td>
            <td>{{ m.quantidade }}</td>
            <td>{{ m.usuario.nome }}</td>
            <td>{{ m.cliente.nome if m.cliente else "-" }}</td>
        </tr>
        {% endfor %}
    </table>

    <h2>Nova movimentação</h2>
    <form method="post" action="/movimentacoes/nova">
        <label>Produto</label>
        <select name="produto_id" required>
            {% for p in produtos %}
            <option value="{{ p.id }}">{{ p.nome }}</option>
            {% endfor %}
        </select>

        <label>Tipo</label>
        <select name="tipo" required>
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
        </select>

        <label>Quantidade</label>
        <input type="number" step="0.01" name="quantidade" required>

        <label>Valor unitário</label>
        <input type="number" step="0.01" name="valor_unitario" value="0">

        <label>Usuário responsável</label>
        <select name="usuario_id" required>
            {% for u in usuarios %}
            <option value="{{ u.id }}">{{ u.nome }}</option>
            {% endfor %}
        </select>

        <label>Cliente (se for saída)</label>
        <select name="cliente_id">
            <option value="">Nenhum</option>
            {% for c in clientes %}
            <option value="{{ c.id }}">{{ c.nome }}</option>
            {% endfor %}
        </select>

        <button type="submit">Registrar</button>
    </form>
</body>
</html>
