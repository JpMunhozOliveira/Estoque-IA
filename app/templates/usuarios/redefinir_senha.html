<!DOCTYPE html>
<html>
<head>
    <title>Redefinir senha de {{ usuario.nome }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {% include "base/nav.html" %}
    <h1>Redefinir senha de {{ usuario.nome }}</h1>
    <form method="post" action="/usuarios/{{ usuario.id }}/redefinir-senha">
        {% include "base/csrf.html" %}
        <label>Nova senha (6 a 72 caracteres)</label>
        <input type="password" name="nova_senha" required minlength="6" maxlength="72">
        <label>Confirmar nova senha</label>
        <input type="password" name="confirmar" required minlength="6" maxlength="72">
        <button type="submit">Salvar</button>
    </form>
</body>
</html>
