<!DOCTYPE html>
<html>

<head>
    <title>Editar Produto</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <h1>Editar Produto</h1>
    <form method="post" action="/produtos/{{ produto.id }}/editar">
        <label>Nome</label>
        <input type="text" name="nome" value="{{ produto.nome }}" required>

        <label>Categoria</label>
        <input type="text" name="categoria" value="{{ produto.categoria or '' }}">

        <label>Quantidade</label>
        <input type="number" step="0.01" name="quantidade" value="{{ produto.quantidade }}">

        <label>Unidade</label>
        <input type="text" name="unidade" value="{{ produto.unidade }}">

        <label>Estoque mínimo</label>
        <input type="number" step="0.01" name="estoque_minimo" value="{{ produto.estoque_minimo }}">

        <label>Preço de custo</label>
        <input type="number" step="0.01" name="preco_custo" value="{{ produto.preco_custo }}">

        <label>Preço de venda</label>
        <input type="number" step="0.01" name="preco_venda" value="{{ produto.preco_venda }}">

        <label>Fornecedor</label>
        <select name="fornecedor_id">
            <option value="">Nenhum</option>
            {% for f in fornecedores %}
            <option value="{{ f.id }}" {% if produto.fornecedor_id==f.id %}selected{% endif %}>{{ f.nome }}</option>
            {% endfor %}
        </select>

        <button type="submit">Salvar</button>
    </form>
    <a href="/produtos/pagina">Voltar</a>
</body>

</html>
