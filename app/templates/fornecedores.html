<!DOCTYPE html>
<html>
<head>
    <title>Estoque - Fornecedores</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {% include "_nav.html" %}
    <h1>Fornecedores</h1>
    <table>
        <tr><th>Nome</th><th>Contato</th><th>Ações</th></tr>
        {% for f in fornecedores %}
        <tr>
            <td>{{ f.nome }}</td>
            <td>{{ f.contato or "-" }}</td>
            {% if request.session.get("papel") == "gestor" %}
            <td>
                <a href="/fornecedores/{{ f.id }}/editar">Editar</a>
                <form method="post" action="/fornecedores/{{ f.id }}/remover" style="display:inline">
                    <button type="submit">Remover</button>
                </form>
            </td>
            {% endif %}
        </tr>
        {% endfor %}
    </table>

    <h2>Novo fornecedor</h2>
    <form method="post" action="/fornecedores/novo">
        <label>Nome</label>
        <input type="text" name="nome" required>
        <label>Contato</label>
        <input type="text" name="contato">
        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
